<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LongOS 2D Dashboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090F;
      --bg-2: #0C1018;
      --surface: #11161F;
      --surface-2: #171D29;
      --surface-3: #1F2633;
      --line: rgba(255, 255, 255, 0.06);
      --line-2: rgba(255, 255, 255, 0.11);
      --text: #EEF1F7;
      --text-2: #A9B1C2;
      --text-3: #6B7487;
      --money: #F5B547;
      --money-soft: rgba(245, 181, 71, 0.14);
      --sleep: #A48BFA;
      --sleep-soft: rgba(164, 139, 250, 0.14);
      --move: #3DDC97;
      --move-soft: rgba(61, 220, 151, 0.14);
      --room: #4CC3FF;
      --room-soft: rgba(76, 195, 255, 0.14);
      --task: #FF7A8A;
      --task-soft: rgba(255, 122, 138, 0.14);
      --good: #3DDC97;
      --warn: #F5B547;
      --bad: #FF6B6B;
      --radius: 22px;
      --radius-sm: 14px;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --safe-top: max(env(safe-area-inset-top, 0px), var(--tg-content-safe-area-inset-top, 0px));
      --safe-bottom: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px));
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); }
    body {
      font-family: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      font-feature-settings: "tnum" 1;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    input, select { font: inherit; color: inherit; }

    /* Ambient background: two slow drifting glows, transform-only. */
    .ambient { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .ambient i {
      position: absolute; width: 70vw; height: 70vw; border-radius: 50%;
      filter: blur(70px); opacity: 0.22; will-change: transform;
    }
    .ambient i:nth-child(1) { background: #3B4CCA; top: -25vw; left: -20vw; animation: drift 22s ease-in-out infinite alternate; }
    .ambient i:nth-child(2) { background: #0E8A7A; bottom: -30vw; right: -25vw; animation: drift 28s ease-in-out infinite alternate-reverse; opacity: 0.16; }
    @keyframes drift { to { transform: translate3d(12vw, 10vw, 0) scale(1.15); } }

    .app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
    .scroller {
      flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
      padding: calc(var(--safe-top) + 14px) 16px calc(var(--safe-bottom) + 108px);
      overscroll-behavior: contain;
    }

    /* Header */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .hello small { display: block; color: var(--text-3); font-size: 12.5px; font-weight: 500; letter-spacing: 0.02em; }
    .hello h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
    .top-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center;
      background: var(--surface); border: 1px solid var(--line); color: var(--text-2);
      transition: transform 0.2s var(--ease-out), background 0.2s;
    }
    .icon-btn:active { transform: scale(0.9); }
    .icon-btn.on { color: var(--money); background: var(--money-soft); border-color: transparent; }
    .icon-btn svg { width: 19px; height: 19px; }
    .spin svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Pull to refresh */
    .ptr { height: 0; display: grid; place-items: center; overflow: hidden; color: var(--text-3); font-size: 12px; transition: height 0.25s var(--ease-out); }
    .ptr .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--room); }

    /* Cards */
    .card {
      position: relative; background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0) 60%), var(--surface);
      border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; overflow: hidden;
    }
    .card.tight { padding: 14px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
    .eyebrow { font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: 0.06em; text-transform: uppercase; }
    .card-title { font-size: 15px; font-weight: 600; }
    .link { font-size: 13px; font-weight: 600; color: var(--room); }
    .muted { color: var(--text-2); }
    .faint { color: var(--text-3); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-2 > .card { margin-bottom: 0; }
    .stack-12 > * + * { margin-top: 12px; }

    /* Entrance motion: staggered rise. --i set per element. */
    .rise { opacity: 0; transform: translateY(14px) scale(0.985); animation: rise 0.6s var(--ease-out) forwards; animation-delay: calc(var(--i, 0) * 55ms); }
    @keyframes rise { to { opacity: 1; transform: none; } }
    .view-enter { animation: viewIn 0.42s var(--ease-out); }
    @keyframes viewIn { from { opacity: 0; transform: translateX(var(--dir, 18px)); } }

    /* Hero */
    .hero { padding: 20px; background:
      radial-gradient(120% 90% at 100% 0%, rgba(245,181,71,0.16), transparent 55%),
      radial-gradient(90% 80% at 0% 100%, rgba(76,195,255,0.10), transparent 60%), var(--surface); }
    .hero-row { display: flex; align-items: center; gap: 16px; }
    .hero-main { flex: 1; min-width: 0; }
    .big-num { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin: 6px 0 4px; white-space: nowrap; }
    .big-num .unit { font-size: 18px; font-weight: 600; color: var(--text-2); margin-left: 3px; }
    .hero-sub { font-size: 13px; color: var(--text-2); line-height: 1.45; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .pill.good { background: rgba(61,220,151,0.13); color: var(--good); }
    .pill.warn { background: rgba(245,181,71,0.14); color: var(--warn); }
    .pill.bad { background: rgba(255,107,107,0.14); color: var(--bad); }
    .pill.neutral { background: var(--surface-3); color: var(--text-2); }

    /* Rings */
    .rings { width: 118px; height: 118px; flex-shrink: 0; position: relative; }
    .rings svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .rings circle { fill: none; stroke-linecap: round; }
    .rings .track { stroke: rgba(255,255,255,0.06); }
    .rings .val { stroke-dasharray: 100 100; stroke-dashoffset: 100; transition: stroke-dashoffset 1.4s var(--ease-out); }
    .rings-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
    .rings-center b { font-size: 20px; font-weight: 800; display: block; letter-spacing: -0.02em; line-height: 1; }
    .rings-center span { font-size: 8.5px; color: var(--text-3); font-weight: 700; letter-spacing: 0.08em; }
    .legend { display: flex; gap: 14px; margin-top: 16px; flex-wrap: wrap; }
    .legend div { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2); }
    .legend i { width: 8px; height: 8px; border-radius: 50%; }
    .legend b { color: var(--text); font-weight: 600; }

    /* Quick actions */
    .quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
    .qa { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 4px 10px; border-radius: 18px;
      background: var(--surface); border: 1px solid var(--line); font-size: 11.5px; font-weight: 600; color: var(--text-2);
      transition: transform 0.25s var(--ease-spring), background 0.2s; }
    .qa:active { transform: scale(0.9); background: var(--surface-2); }
    .qa .ico { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; }

    /* Jarvis */
    .jarvis { display: flex; gap: 12px; }
    .orb { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; position: relative;
      background: radial-gradient(circle at 35% 30%, #9EE7FF, #4C7DFF 55%, #6E3BFF); box-shadow: 0 0 22px rgba(92,120,255,0.45); }
    .orb::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1px solid rgba(140,170,255,0.35); animation: pulse 2.6s ease-out infinite; }
    @keyframes pulse { from { transform: scale(0.85); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
    .jarvis p { font-size: 13.5px; line-height: 1.55; color: var(--text-2); }
    .jarvis p b { color: var(--text); font-weight: 600; }
    .next-step { margin-top: 12px; display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 14px;
      background: var(--surface-2); font-size: 13px; font-weight: 500; width: 100%; text-align: left; }
    .next-step .arrow { margin-left: auto; color: var(--text-3); }

    /* Lists */
    .list { display: flex; flex-direction: column; }
    .row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); width: 100%; text-align: left;
      transition: opacity 0.3s, transform 0.35s var(--ease-out); }
    .row:first-child { border-top: 0; padding-top: 2px; }
    .row .ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 17px; background: var(--surface-2); flex-shrink: 0; }
    .row .main { flex: 1; min-width: 0; }
    .row .t { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .s { font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .row .amt { font-size: 14px; font-weight: 600; white-space: nowrap; }
    .row.leaving { opacity: 0; transform: translateX(40px); }
    .day-label { font-size: 12px; font-weight: 600; color: var(--text-3); margin: 14px 0 2px; display: flex; justify-content: space-between; }
    .day-label:first-child { margin-top: 0; }

    /* Inbox chips */
    .inbox-item { padding: 12px; border-radius: 16px; background: var(--surface-2); margin-top: 10px; transition: opacity .3s, transform .35s var(--ease-out); }
    .inbox-item.leaving { opacity: 0; transform: scale(0.96); }
    .inbox-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip { padding: 7px 11px; border-radius: 999px; background: var(--surface-3); font-size: 12.5px; font-weight: 500; border: 1px solid transparent;
      transition: transform 0.2s var(--ease-spring), background 0.2s, border-color 0.2s; }
    .chip:active { transform: scale(0.92); }
    .chip.sel { background: var(--money-soft); border-color: rgba(245,181,71,0.5); color: var(--money); }

    /* Bars */
    .bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,0.06); position: relative; overflow: visible; }
    .bar > .fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; width: 0; transition: width 1.1s var(--ease-out); }
    .bar > .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); border-radius: 2px; opacity: 0.7; }
    .bar.thin { height: 6px; }
    .kv { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-2); margin-top: 8px; }

    /* Segmented */
    .seg { display: flex; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; position: relative; }
    .seg button { flex: 1; padding: 9px 4px; font-size: 13px; font-weight: 600; color: var(--text-3); position: relative; z-index: 1; transition: color 0.25s; }
    .seg button.on { color: var(--text); }
    .seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 10px; background: var(--surface-3); transition: transform 0.35s var(--ease-out), width 0.35s var(--ease-out); }

    /* Charts */
    .bars14 { display: flex; align-items: flex-end; gap: 5px; height: 120px; position: relative; padding-top: 6px; }
    .bars14 .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; }
    .bars14 .b { width: 100%; height: calc(100% - 20px); border-radius: 6px 6px 3px 3px; background: rgba(245,181,71,0.32); transform: scaleY(0); transform-origin: bottom;
      transition: transform 0.8s var(--ease-out), background 0.2s; min-height: 3px; }
    .bars14 .col.today .b { background: var(--money); }
    .bars14 .col.over .b { background: rgba(255,107,107,0.55); }
    .bars14 .col.sel .b { background: var(--text); }
    .bars14 .lbl { font-size: 9.5px; color: var(--text-3); font-weight: 500; height: 14px; line-height: 14px; }
    .bars14 .limit { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(255,255,255,0.22); pointer-events: none; }
    .tip { font-size: 12.5px; color: var(--text-2); margin-top: 10px; min-height: 18px; }

    .donut-wrap { display: flex; align-items: center; gap: 16px; }
    .donut { width: 112px; height: 112px; flex-shrink: 0; position: relative; }
    .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .donut circle { fill: none; stroke-width: 13; transition: stroke-dasharray 1.1s var(--ease-out); }
    .donut .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 11px; color: var(--text-3); }
    .donut .c b { display: block; font-size: 15px; color: var(--text); }
    .cat-list { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 9px; }
    .cat-line { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
    .cat-line i { width: 8px; height: 8px; border-radius: 3px; flex-shrink: 0; }
    .cat-line span { flex: 1; min-width: 0; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .spark { width: 100%; height: 70px; display: block; overflow: visible; }
    .spark path.line { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.6s var(--ease-out); }
    .spark path.area { opacity: 0; transition: opacity 1s 0.6s; }
    .spark.drawn path.line { stroke-dashoffset: 0; }
    .spark.drawn path.area { opacity: 1; }

    /* Stat tiles */
    .stat .lbl { font-size: 12px; color: var(--text-3); font-weight: 500; }
    .stat .val { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-top: 6px; }
    .stat .val small { font-size: 13px; color: var(--text-2); font-weight: 500; margin-left: 2px; }
    .stat .foot { font-size: 12px; color: var(--text-3); margin-top: 4px; }

    /* Gauge */
    .gauge { position: relative; width: 150px; height: 88px; margin: 0 auto; }
    .gauge svg { width: 100%; height: 100%; overflow: visible; }
    .gauge path { fill: none; stroke-width: 12; stroke-linecap: round; }
    .gauge .val { stroke-dasharray: 100 100; stroke-dashoffset: 100; transition: stroke-dashoffset 1.4s var(--ease-out); }
    .gauge .c { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; }
    .gauge .c b { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; }

    .stages { display: flex; height: 12px; border-radius: 99px; overflow: hidden; gap: 2px; margin-top: 12px; }
    .stages i { display: block; height: 100%; transform: scaleX(0); transform-origin: left; transition: transform 1s var(--ease-out); }

    /* Room */
    .room-big { display: flex; align-items: flex-end; gap: 18px; }
    .room-big .t { font-size: 52px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
    .room-big .t sup { font-size: 20px; font-weight: 600; color: var(--text-2); vertical-align: top; margin-left: 2px; }
    .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
    .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(61,220,151,0.6); animation: live 2s infinite; }
    .live.off i { background: var(--text-3); animation: none; }
    @keyframes live { 70% { box-shadow: 0 0 0 8px rgba(61,220,151,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,151,0); } }

    /* Tasks */
    .task { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); transition: opacity 0.35s, transform 0.4s var(--ease-out); }
    .task:first-child { border-top: 0; }
    .check { width: 26px; height: 26px; border-radius: 9px; border: 2px solid var(--line-2); flex-shrink: 0; display: grid; place-items: center;
      transition: background 0.25s, border-color 0.25s, transform 0.3s var(--ease-spring); }
    .check svg { width: 14px; height: 14px; stroke: #07090F; stroke-width: 3.2; fill: none; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset 0.35s 0.08s var(--ease-out); }
    .task.done .check { background: var(--move); border-color: var(--move); transform: scale(1.12); }
    .task.done .check svg { stroke-dashoffset: 0; }
    .task.done .t { text-decoration: line-through; color: var(--text-3); }
    .task.gone { opacity: 0; transform: translateX(30px); }
    .task .main { flex: 1; min-width: 0; }
    .task .t { font-size: 14px; font-weight: 500; transition: color 0.3s; }
    .task .s { font-size: 12px; color: var(--text-3); margin-top: 3px; }
    .task .more { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--text-3); }

    /* Empty + error */
    .empty { text-align: center; padding: 18px 8px; color: var(--text-3); font-size: 13px; line-height: 1.5; }
    .empty .e { font-size: 28px; display: block; margin-bottom: 6px; }

    /* Skeleton */
    .sk { border-radius: var(--radius); background: var(--surface); margin-bottom: 12px; position: relative; overflow: hidden; }
    .sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); animation: shimmer 1.3s infinite; }
    @keyframes shimmer { to { transform: translateX(100%); } }

    /* Tab bar */
    .tabbar {
      position: fixed; left: 12px; right: 12px; bottom: calc(var(--safe-bottom) + 10px); z-index: 20; max-width: 536px; margin: 0 auto;
      display: flex; padding: 6px; border-radius: 24px; background: rgba(17,22,31,0.82);
      border: 1px solid var(--line-2); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%);
    }
    .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 6px; font-size: 10.5px; font-weight: 600;
      color: var(--text-3); position: relative; z-index: 1; transition: color 0.25s; }
    .tab svg { width: 21px; height: 21px; transition: transform 0.35s var(--ease-spring); }
    .tab.on { color: var(--text); }
    .tab.on svg { transform: translateY(-1px) scale(1.08); }
    .tab-ind { position: absolute; top: 6px; bottom: 6px; left: 6px; border-radius: 18px; background: rgba(255,255,255,0.07); transition: transform 0.4s var(--ease-out); }
    .badge { position: absolute; top: 4px; right: calc(50% - 18px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--task);
      color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }

    /* Sheet */
    .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.55); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 40; }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 88vh; overflow-y: auto; max-width: 560px; margin: 0 auto;
      background: var(--bg-2); border-top: 1px solid var(--line-2); border-radius: 26px 26px 0 0;
      padding: 10px 18px calc(var(--safe-bottom) + 20px); transform: translateY(105%); transition: transform 0.45s var(--ease-out); }
    .sheet.open { transform: none; }
    .grab { width: 38px; height: 5px; border-radius: 9px; background: var(--line-2); margin: 0 auto 14px; }
    .sheet h3 { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-3); margin-bottom: 7px; letter-spacing: 0.03em; }
    .input { width: 100%; padding: 13px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-2); outline: none; font-size: 15px;
      transition: border-color 0.2s; }
    .input:focus { border-color: rgba(76,195,255,0.6); }
    .amount-input { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; text-align: center; padding: 14px; }
    .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .cat-btn { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 2px; border-radius: 14px; background: var(--surface);
      border: 1px solid var(--line); font-size: 11px; font-weight: 500; color: var(--text-2); transition: transform 0.2s var(--ease-spring), border-color 0.2s, background 0.2s; }
    .cat-btn span { font-size: 20px; }
    .cat-btn.sel { border-color: rgba(245,181,71,0.6); background: var(--money-soft); color: var(--text); }
    .cat-btn:active { transform: scale(0.92); }
    .btn { width: 100%; padding: 15px; border-radius: 16px; font-weight: 700; font-size: 15px; background: var(--text); color: #07090F;
      transition: transform 0.2s var(--ease-spring), opacity 0.2s; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; }
    .btn.ghost { background: var(--surface-2); color: var(--text); }
    .btn.danger { background: rgba(255,107,107,0.14); color: var(--bad); }
    .btn-row { display: flex; gap: 10px; }
    .mood-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .mood-btn { padding: 12px 4px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: center; font-size: 11px; color: var(--text-2);
      transition: transform 0.25s var(--ease-spring), border-color 0.2s; }
    .mood-btn span { display: block; font-size: 26px; margin-bottom: 4px; }
    .mood-btn:active { transform: scale(0.9); }

    /* Toast */
    .toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--safe-bottom) + 92px); z-index: 60; max-width: 528px; margin: 0 auto; display: flex; align-items: center; gap: 10px;
      padding: 13px 14px; border-radius: 16px; background: #F3F5FA; color: #0B0F17; font-size: 13.5px; font-weight: 600;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35); transform: translateY(140%); opacity: 0; pointer-events: none;
      transition: transform 0.45s var(--ease-spring), opacity 0.3s; }
    .toast.show { transform: none; opacity: 1; pointer-events: auto; }
    .toast.err { background: #FFE3E3; color: #6B0F0F; }
    .toast button { margin-left: auto; font-weight: 700; color: #2457D6; padding: 2px 4px; }

    /* Privacy */
    body.private .money { filter: blur(8px); transition: filter 0.3s; }

    /* Confetti-free celebration: a soft burst behind completed tasks */
    .burst { position: fixed; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; z-index: 70; animation: burst 0.7s var(--ease-out) forwards; }
    @keyframes burst { to { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
      .rise { opacity: 1; transform: none; }
    }
    @media (max-width: 360px) {
      .big-num { font-size: 28px; }
      .rings { width: 100px; height: 100px; }
      .quick { gap: 6px; }
    }
  </style>
</head>
<body>
  <div class="ambient"><i></i><i></i></div>
  <div class="app">
    <main class="scroller" id="scroller">
      <div class="ptr" id="ptr"><div class="dot"></div></div>
      <header class="top">
        <div class="hello">
          <small id="dateLine">LongOS</small>
          <h1 id="greet">Xin chào</h1>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="privacyBtn" aria-label="Che số tiền">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button class="icon-btn" id="refreshBtn" aria-label="Làm mới">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
      </header>
      <div id="view"></div>
    </main>

    <nav class="tabbar" id="tabbar">
      <div class="tab-ind" id="tabInd"></div>
      <button class="tab on" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hôm nay</button>
      <button class="tab" data-tab="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="3"/><path d="M2 10h20"/><path d="M16 15h2"/></svg>Tiền</button>
      <button class="tab" data-tab="health"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 22l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>Sức khỏe</button>
      <button class="tab" data-tab="room"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V4a2 2 0 1 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg>Phòng</button>
      <button class="tab" data-tab="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Việc</button>
    </nav>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
  <div class="toast" id="toast"><span id="toastText"></span><button id="toastAction" hidden></button></div>

  <script>
    var host = window.location.hostname;
    var isRemote = host === 'localhost' || host === '127.0.0.1' || host.indexOf('github.io') >= 0;
    var BASE = isRemote ? 'https://ucgbvsmxljilmgrdfazk.supabase.co/functions/v1/room-telegram' : '';
    var API_URL = BASE + '?action=dashboard_data';
    var ACTION_URL = BASE + '?action=dashboard_action';

    var tg = window.Telegram && window.Telegram.WebApp;
    var state = { data: null, tab: 'today', moneyRange: 'month', selDay: null, loading: false, error: null, sheetOpen: false };
    var TABS = ['today', 'money', 'health', 'room', 'tasks'];
    var CAT_COLORS = { food: '#F5B547', transport: '#4CC3FF', shopping: '#FF7A8A', bills: '#A48BFA', entertainment: '#3DDC97', health: '#FF9F5A', other: '#8792A8', income: '#3DDC97' };

    function store(key, value) {
      try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch (e) { return null; }
    }
    function haptic(kind) {
      try {
        if (!tg || !tg.HapticFeedback) return;
        if (kind === 'success' || kind === 'error' || kind === 'warning') tg.HapticFeedback.notificationOccurred(kind);
        else if (kind === 'select') tg.HapticFeedback.selectionChanged();
        else tg.HapticFeedback.impactOccurred(kind || 'light');
      } catch (e) {}
    }
    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
    }
    function vnd(n) { return Math.round(Number(n) || 0).toLocaleString('vi-VN'); }
    function vndShort(n) {
      n = Number(n) || 0;
      var a = Math.abs(n);
      if (a >= 1e9) return (n / 1e9).toFixed(1).replace('.0', '').replace('.', ',') + ' tỷ';
      if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 1 : 2).replace(/\.?0+$/, '').replace('.', ',') + 'tr';
      if (a >= 1e3) return Math.round(n / 1e3) + 'k';
      return String(Math.round(n));
    }
    function money(n, cls) { return '<span class="money ' + (cls || '') + '">' + vnd(n) + '&nbsp;đ</span>'; }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function pad(n) { return String(n).padStart(2, '0'); }
    function plural(list) { return Array.isArray(list) ? list : []; }
    function dm(iso) { var p = String(iso || '').split('-'); return p.length === 3 ? Number(p[2]) + '/' + Number(p[1]) : String(iso || ''); }

    /* ---------- Telegram setup ---------- */
    if (tg) {
      try {
        tg.ready(); tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#07090F');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#07090F');
        if (tg.setBottomBarColor) tg.setBottomBarColor('#07090F');
        if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        if (tg.BackButton) tg.BackButton.onClick(function () { if (state.sheetOpen) closeSheet(); else switchTab('today'); });
      } catch (e) {}
    }
    function syncBackButton() {
      if (!tg || !tg.BackButton) return;
      try { if (state.sheetOpen || state.tab !== 'today') tg.BackButton.show(); else tg.BackButton.hide(); } catch (e) {}
    }

    /* ---------- Network ---------- */
    function authHeaders(extra) {
      var wa = tg;
      var diag = 'c=3;sdk=' + (wa ? 1 : 0) + ';plat=' + ((wa && wa.platform) || '-') + ';ver=' + ((wa && wa.version) || '-')
        + ';init=' + ((wa && wa.initData) ? wa.initData.length : 0) + ';hash=' + (location.hash.indexOf('tgWebAppData') >= 0 ? 1 : 0)
        + ';user=' + ((wa && wa.initDataUnsafe && wa.initDataUnsafe.user) ? 1 : 0);
      var h = { 'x-telegram-init-data': (wa && wa.initData) || '', 'x-miniapp-diag': diag };
      for (var k in (extra || {})) h[k] = extra[k];
      return h;
    }
    function loadData(opts) {
      opts = opts || {};
      if (state.loading) return Promise.resolve();
      state.loading = true;
      setRefreshing(true);
      if (!state.data && !opts.silent) renderSkeleton();
      return fetch(API_URL, { headers: authHeaders() }).then(function (res) {
        if (res.status === 401) {
          return res.json().catch(function () { return {}; }).then(function (j) {
            var hasInit = Boolean(tg && tg.initData);
            var err = new Error(j.reason === 'expired' ? 'Phiên đã hết hạn. Đóng Mini App rồi mở lại từ /app nhé.'
              : !hasInit ? 'Telegram chưa gửi thông tin đăng nhập cho trang này. Gõ /app trong bot rồi bấm nút “Mở Dashboard 2D” ngay dưới tin nhắn.'
              : 'Không xác thực được phiên này (' + (j.reason || 'không rõ') + ').');
            err.auth = true;
            throw err;
          });
        }
        if (!res.ok) throw new Error('Máy chủ trả lỗi ' + res.status);
        return res.json();
      }).then(function (json) {
        state.data = json; state.error = null;
        render(opts.silent ? 'silent' : 'enter');
      }).catch(function (err) {
        state.error = err;
        if (!state.data) renderError(err); else toast(err.message || 'Không tải được dữ liệu', true);
      }).then(function () {
        state.loading = false; setRefreshing(false);
      });
    }
    function act(body, okText, opts) {
      opts = opts || {};
      return fetch(ACTION_URL, { method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify(body) })
        .then(function (res) { return res.json().catch(function () { return { ok: false }; }); })
        .then(function (j) {
          if (!j.ok) throw new Error(j.message || 'Chưa lưu được, thử lại nhé');
          haptic('success');
          if (okText !== false) toast(okText || j.message || 'Đã lưu', false, opts.undo);
          loadData({ silent: true });
          return j;
        })
        .catch(function (err) { haptic('error'); toast(err.message || 'Có lỗi xảy ra', true); throw err; });
    }

    /* ---------- Chrome ---------- */
    var refreshBtn = document.getElementById('refreshBtn');
    function setRefreshing(on) { refreshBtn.classList.toggle('spin', on); }
    refreshBtn.addEventListener('click', function () { haptic('light'); loadData({ silent: Boolean(state.data) }); });

    var privacyBtn = document.getElementById('privacyBtn');
    function applyPrivacy() {
      var on = store('longos_privacy') === 'true';
      document.body.classList.toggle('private', on);
      privacyBtn.classList.toggle('on', on);
    }
    privacyBtn.addEventListener('click', function () {
      store('longos_privacy', String(store('longos_privacy') !== 'true'));
      applyPrivacy(); haptic('select');
    });
    applyPrivacy();

    function greetText() {
      var h = new Date().getHours();
      if (h < 5) return 'Khuya rồi, nghỉ thôi 🌙';
      if (h < 11) return 'Chào buổi sáng ☀️';
      if (h < 14) return 'Buổi trưa vui vẻ 🍱';
      if (h < 18) return 'Chiều năng lượng 🌤️';
      if (h < 22) return 'Buổi tối thư thả 🌆';
      return 'Sắp đến giờ ngủ 🌙';
    }
    function updateHeader() {
      var d = new Date();
      var days = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
      document.getElementById('dateLine').textContent = days[d.getDay()] + ', ' + d.getDate() + ' tháng ' + (d.getMonth() + 1);
      document.getElementById('greet').textContent = greetText();
    }
    updateHeader();

    /* ---------- Tabs ---------- */
    var tabbar = document.getElementById('tabbar');
    var tabInd = document.getElementById('tabInd');
    function placeIndicator() {
      var btn = tabbar.querySelector('.tab.on');
      if (!btn) return;
      tabInd.style.width = btn.offsetWidth + 'px';
      tabInd.style.transform = 'translateX(' + (btn.offsetLeft - 6) + 'px)';
    }
    function switchTab(tab) {
      if (!tab || tab === state.tab) return;
      var dir = TABS.indexOf(tab) > TABS.indexOf(state.tab) ? '18px' : '-18px';
      state.tab = tab;
      tabbar.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
      placeIndicator(); haptic('select'); syncBackButton();
      document.getElementById('scroller').scrollTo({ top: 0 });
      document.getElementById('view').style.setProperty('--dir', dir);
      render('enter');
    }
    tabbar.addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) switchTab(b.dataset.tab); });
    window.addEventListener('resize', placeIndicator);
    setTimeout(placeIndicator, 50);

    /* ---------- Rendering ---------- */
    var view = document.getElementById('view');
    function renderSkeleton() {
      view.innerHTML = '<div class="sk" style="height:190px"></div><div class="sk" style="height:84px"></div><div class="sk" style="height:130px"></div><div class="sk" style="height:220px"></div>';
    }
    function renderError(err) {
      view.innerHTML = '<div class="card rise" style="--i:0"><div class="empty"><span class="e">' + (err.auth ? '🔐' : '📡') + '</span>'
        + '<div style="color:var(--text);font-weight:600;font-size:15px;margin-bottom:6px">' + (err.auth ? 'Chưa đăng nhập được' : 'Không kết nối được máy chủ') + '</div>'
        + esc(err.message) + '</div><button class="btn ghost" id="retryBtn" style="margin-top:6px">Thử lại</button></div>';
      document.getElementById('retryBtn').addEventListener('click', function () { loadData(); });
    }
    function render(mode) {
      var d = state.data;
      if (!d) return;
      var html = { today: viewToday, money: viewMoney, health: viewHealth, room: viewRoom, tasks: viewTasks }[state.tab](d);
      view.innerHTML = html;
      if (mode === 'enter') { view.classList.remove('view-enter'); void view.offsetWidth; view.classList.add('view-enter'); }
      else view.querySelectorAll('.rise').forEach(function (el) { el.classList.remove('rise'); });
      updateBadge(d);
      requestAnimationFrame(function () { requestAnimationFrame(function () { animateIn(mode); }); });
    }
    function updateBadge(d) {
      var n = plural(d.reminders && d.reminders.pending).length;
      var tasksTab = tabbar.querySelector('[data-tab="tasks"]');
      var b = tasksTab.querySelector('.badge');
      if (n > 0) { if (!b) { b = document.createElement('span'); b.className = 'badge'; tasksTab.appendChild(b); } b.textContent = n > 9 ? '9+' : n; }
      else if (b) b.remove();
    }
    function countUp(el) {
      var to = Number(el.dataset.to) || 0;
      var fmt = el.dataset.fmt || 'vnd';
      var dur = 900, start = performance.now();
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) dur = 1;
      function frame(t) {
        var p = clamp((t - start) / dur, 0, 1);
        var e = 1 - Math.pow(1 - p, 3);
        var v = to * e;
        el.textContent = fmt === 'int' ? Math.round(v).toLocaleString('vi-VN') : vnd(v);
        if (p < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }
    function animateIn(mode) {
      view.querySelectorAll('[data-dash]').forEach(function (el) {
        var v = clamp(Number(el.dataset.dash) || 0, 0, 100);
        if (v <= 0) el.style.opacity = '0'; // a zero-length round cap would still draw a dot
        el.style.strokeDashoffset = String(100 - v);
      });
      view.querySelectorAll('[data-w]').forEach(function (el) { el.style.width = clamp(Number(el.dataset.w) || 0, 0, 100) + '%'; });
      view.querySelectorAll('[data-sy]').forEach(function (el) { el.style.transform = 'scaleY(' + clamp(Number(el.dataset.sy) || 0, 0.02, 1) + ')'; });
      view.querySelectorAll('[data-sx]').forEach(function (el) { el.style.transform = 'scaleX(1)'; });
      view.querySelectorAll('.spark').forEach(function (el) { el.classList.add('drawn'); });
      view.querySelectorAll('[data-arc]').forEach(function (el) { el.style.strokeDasharray = el.dataset.arc; });
      if (mode === 'enter') view.querySelectorAll('[data-to]').forEach(countUp);
      else view.querySelectorAll('[data-to]').forEach(function (el) { el.textContent = el.dataset.fmt === 'int' ? Number(el.dataset.to).toLocaleString('vi-VN') : vnd(el.dataset.to); });
    }
    function num(n, fmt) { return '<span data-to="' + (Number(n) || 0) + '" data-fmt="' + (fmt || 'vnd') + '">0</span>'; }

    /* ---------- Views ---------- */
    function viewToday(d) {
      var f = d.finances || {}, b = f.budget || {}, h = d.health || {}, rings = h.rings || {};
      var i = 0;
      var heroStatus = !b.hasBudget ? '<span class="pill neutral">Chưa đặt ngân sách</span>'
        : b.isOver ? '<span class="pill bad">Vượt ngân sách</span>'
        : (b.pacingDiff > 0 ? '<span class="pill warn">Nhanh hơn nhịp ' + vndShort(b.pacingDiff) + '</span>' : '<span class="pill good">Đúng nhịp chi tiêu</span>');
      var heroValue = b.hasBudget ? b.todayRemaining : f.today;
      var hero = '<section class="card hero rise" style="--i:' + (i++) + '"><div class="hero-row"><div class="hero-main">'
        + '<div class="eyebrow">' + (b.hasBudget ? 'Còn được tiêu hôm nay' : 'Đã chi hôm nay') + '</div>'
        + '<div class="big-num money">' + num(heroValue) + '<span class="unit">đ</span></div>'
        + '<div class="hero-sub">' + (b.hasBudget ? 'Đã chi ' + money(f.today) + ' · hạn mức ' + money(b.safeDaily) + '/ngày' : 'Tuần này ' + money(f.thisWeek) + ' · tháng này ' + money(f.thisMonth)) + '</div>'
        + '<div style="margin-top:10px">' + heroStatus + '</div></div>'
        + ringsSvg(rings) + '</div>'
        + '<div class="legend"><div><i style="background:var(--sleep)"></i>Ngủ <b>' + (h.sleepFormatted ? esc(h.sleepFormatted) : '—') + '</b></div>'
        + '<div><i style="background:var(--move)"></i>Bước <b>' + (h.steps ? vnd(h.steps.current) : '—') + '</b></div>'
        + '<div><i style="background:var(--money)"></i>Ví <b>' + (rings.budget != null ? rings.budget + '%' : '—') + '</b></div></div></section>';

      var quick = '<div class="quick rise" style="--i:' + (i++) + '">'
        + qa('expense', '💸', 'var(--money-soft)', 'Chi') + qa('income', '💰', 'var(--move-soft)', 'Thu')
        + qa('water', '💧', 'var(--room-soft)', 'Nước') + qa('mood', d.mood ? d.mood.emoji : '😊', 'var(--sleep-soft)', 'Cảm xúc')
        + qa('reminder', '⏰', 'var(--task-soft)', 'Nhắc') + '</div>';

      var br = d.briefing || {};
      var jarvis = '<section class="card rise" style="--i:' + (i++) + '"><div class="jarvis"><div class="orb"></div><div>'
        + '<div class="card-title" style="margin-bottom:4px">' + esc(br.greeting || 'Jarvis') + '</div><p>' + esc(br.advice || '') + '</p></div></div>'
        + (br.priorityAction ? '<button class="next-step" data-next="1"><span>🎯</span><span>' + esc(br.priorityAction) + '</span><span class="arrow">›</span></button>' : '')
        + '</section>';

      var inbox = plural(f.unclassifiedExpenses).length ? inboxCard(f.unclassifiedExpenses, i++) : '';

      var pend = plural(d.reminders && d.reminders.pending);
      var tasks = '<section class="card rise" style="--i:' + (i++) + '"><div class="card-head"><div class="card-title">Việc hôm nay</div>'
        + '<button class="link" data-goto="tasks">Tất cả</button></div>'
        + (pend.length ? '<div class="list">' + pend.slice(0, 3).map(taskRow).join('') + '</div>'
          : '<div class="empty"><span class="e">✨</span>Không còn việc nào đang chờ. Đã xong ' + ((d.reminders && d.reminders.completedTodayCount) || 0) + ' việc hôm nay.</div>')
        + '</section>';

      var r = d.room || {};
      var mini = '<div class="grid-2 rise" style="--i:' + (i++) + ';margin-bottom:12px">'
        + '<button class="card tight stat" data-goto="room" style="text-align:left"><div class="lbl">🌡️ Phòng</div><div class="val">'
        + (r.temperature != null ? Number(r.temperature).toFixed(1) + '<small>°C</small>' : '—') + '</div><div class="foot">'
        + (r.temperature != null ? (r.humidity != null ? Math.round(r.humidity) + '% · ' : '') + esc(r.comfort || '') : 'Chưa có số đo') + '</div></button>'
        + '<button class="card tight stat" data-goto="health" style="text-align:left"><div class="lbl">🔋 Pin cơ thể</div><div class="val">'
        + (h.bodyBattery != null ? h.bodyBattery + '<small>%</small>' : '—') + '</div><div class="foot">' + (h.bodyBattery != null ? batteryLabel(h.bodyBattery) : 'Chưa có dữ liệu') + '</div></button></div>';

      return hero + quick + jarvis + inbox + tasks + mini;
    }

    function burst(anchor) {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var r = anchor.getBoundingClientRect();
      var colors = ['#3DDC97', '#F5B547', '#4CC3FF', '#A48BFA', '#FF7A8A'];
      for (var k = 0; k < 10; k++) {
        var p = document.createElement('i');
        p.className = 'burst';
        var ang = (Math.PI * 2 * k) / 10, dist = 26 + Math.random() * 16;
        p.style.left = (r.left + r.width / 2 - 5) + 'px'; p.style.top = (r.top + r.height / 2 - 5) + 'px';
        p.style.background = colors[k % colors.length];
        p.style.setProperty('--dx', Math.cos(ang) * dist + 'px'); p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
        document.body.appendChild(p);
        setTimeout(function (n) { n.remove(); }, 750, p);
      }
    }

    function parseAmount(text) {
      var s = String(text || '').toLowerCase().replace(/\s/g, '').replace(/đ|vnd/g, '');
      var m = s.match(/^(\d+(?:[.,]\d+)?)(k|tr|m|trieu|triệu)?$/);
      if (m) {
        var v = parseFloat(m[1].replace(',', '.'));
        if (m[2] === 'k') return Math.round(v * 1000);
        if (m[2]) return Math.round(v * 1e6);
        if (/[.,]\d{3}$/.test(m[1])) return Number(m[1].replace(/[.,]/g, ''));
        return Math.round(v);
      }
      var digits = s.replace(/[^\d]/g, '');
      return digits ? Number(digits) : 0;
    }

        if (pulled > 60) { haptic('medium'); ptr.style.height = '44px'; ptr.querySelector('.dot').style.animation = 'spin .8s linear infinite';
          loadData({ silent: true }).then(function () { ptr.style.height = '0'; ptr.querySelector('.dot').style.animation = ''; });
        } else ptr.style.height = '0';
        y0 = null;
      });
    })();

    /* ---------- Boot ---------- */
    syncBackButton();
    loadData();
    setInterval(function () { if (!document.hidden && !state.sheetOpen) { updateHeader(); loadData({ silent: true }); } }, 60000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && state.data) loadData({ silent: true }); });
  </script>
</body>
</html>
